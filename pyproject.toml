[project]
name = "jev-board"
version = "0.1.0"
description = "Rank a GitHub Project board's open items with Jev, read-only."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typesafe-sdk>=0.7",
    "textual>=0.80",
]

[project.scripts]
jev-board = "jev_board.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jev_board"]

[tool.pytest.ini_options]
testpaths = ["tests"]
